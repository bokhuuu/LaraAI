# Routes all HTTP requests to Laravel's index.php entry point.
# PHP files handled by PHP-FPM running on port 9000.

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # PHP-FPM runs in the same container as Nginx.
        # If you split into separate containers, change to: fastcgi_pass app:9000;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
}