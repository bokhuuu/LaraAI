# Runs the full Pest test suite on every push to main and every pull request.
# Spins up MySQL, installs PHP 8.4 with required extensions, then runs tests.
# If any test fails the push is marked as failed on GitHub.
#
# Required secrets: none (uses root MySQL for test DB)
# Required env: DB_* variables injected directly in the 'Run tests' step

name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: laraai_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ghostscript
          sudo apt-get install -y libmagickwand-dev --fix-missing

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_mysql, redis, pcntl, imagick

      - name: Install dependencies
        run: composer install --no-interaction --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Run tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: laraai_test
          DB_USERNAME: root
          DB_PASSWORD: root
          REDIS_HOST: 127.0.0.1
        run: php artisan test
      - name: Check formatting
        run: ./vendor/bin/pint --test
